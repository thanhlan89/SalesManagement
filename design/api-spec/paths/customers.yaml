get:
  tags:
    - Customers
  summary: List customers
  operationId: listCustomers
  parameters:
    - name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    - name: status
      in: query
      schema:
        type: string
        enum:
          - lead
          - active
          - inactive
          - blocked
    - name: search
      in: query
      schema:
        type: string
  responses:
    "200":
      description: Customers returned successfully.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: ../components/schemas/index.yaml#/Customer
              meta:
                $ref: ../components/schemas/index.yaml#/PaginationMeta
post:
  tags:
    - Customers
  summary: Create customer
  operationId: createCustomer
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/index.yaml#/CreateCustomerRequest
  responses:
    "201":
      description: Customer created successfully.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/index.yaml#/Customer
    "400":
      $ref: ../components/responses/errors.yaml#/BadRequest
