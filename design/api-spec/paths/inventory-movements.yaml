get:
  tags:
    - Inventory
  summary: List inventory movements
  operationId: listInventoryMovements
  parameters:
    - name: warehouseId
      in: query
      schema:
        type: string
        format: uuid
    - name: productId
      in: query
      schema:
        type: string
        format: uuid
  responses:
    "200":
      description: Inventory movements returned successfully.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: ../components/schemas/index.yaml#/InventoryMovement
post:
  tags:
    - Inventory
  summary: Create inventory movement
  operationId: createInventoryMovement
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/index.yaml#/CreateInventoryMovementRequest
  responses:
    "201":
      description: Inventory movement created successfully.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/index.yaml#/InventoryMovement
    "400":
      $ref: ../components/responses/errors.yaml#/BadRequest
