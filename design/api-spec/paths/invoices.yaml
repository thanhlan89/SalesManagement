get:
  tags:
    - Billing
  summary: List invoices
  operationId: listInvoices
  parameters:
    - name: customerId
      in: query
      schema:
        type: string
        format: uuid
    - name: status
      in: query
      schema:
        type: string
        enum:
          - draft
          - issued
          - partially_paid
          - paid
          - overdue
          - void
  responses:
    "200":
      description: Invoices returned successfully.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: ../components/schemas/index.yaml#/Invoice
