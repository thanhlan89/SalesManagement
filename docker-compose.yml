services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sales
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  app:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/sales
      JWT_SECRET: change-me
      JWT_REFRESH_SECRET: change-me
      JWT_EXPIRES_IN: 1h
      JWT_REFRESH_EXPIRES_IN: 7d
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:5173
    ports:
      - '3000:3000'
    restart: on-failure

  frontend:
    build:
      context: ./frontend
    ports:
      - '5173:80'
    restart: on-failure

volumes:
  db-data:
